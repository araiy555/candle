# config.toml にコピーして使います（config.toml は .gitignore 済み）。
# APIパスワードはここに書かず、環境変数 KABU_API_PASSWORD に設定してください。

[api]
# 本番 18080 / 検証 18081
port = 18080
host = "localhost"

[universe]
# 監視銘柄数（登録上限50のうち、保有銘柄用に予備枠を残す）
size = 45
# ランキングの市場区分: T=東証全体, TP=プライム, ALL=全市場
exchange_division = "T"
# 固定リストを使う場合はここに銘柄コードを書く（空ならランキングから選定）
symbols = []
# 除外したい銘柄コード（ETFなど）
exclude = []

[data]
dir = "data"
# 受信メッセージ（必要項目のみ）をJSONLで保存する。再生・検証用。
record_raw = true

[bars]
minutes = 5

[risk]
# 全戦略共通の上限（円）。仮の値です。運用前に必ず見直してください。
total_cap = 1000000        # 総投資上限
per_symbol_cap = 500000    # 1銘柄あたりの投資上限
daily_max_loss = 20000     # 1日の最大損失（到達で新規停止）
min_risk_pct = 0.001       # 損切り幅がこれ未満（価格比）のサインは見送る
max_risk_pct = 0.03        # 損切り幅がこれを超えるサインは見送る

[trading]
slippage = 0.0005          # 約定の不利な滑り（価格比、片道）
exit_after = "15:20"       # この時刻以降は新規停止・全決済（持ち越しなし）
# 止めたい戦略ID: tweezer_bottom, bullish_engulfing, hammer, morning_star,
#                 piercing_line, bullish_harami, double_bottom
disabled_strategies = []

[web]
port = 8765                # 管理画面 http://localhost:8765 （このPCからのみ閲覧可）

[notify]
# watch（通知のみ）モードで通知する戦略ID
strategies = ["tweezer_bottom"]
desktop = true             # Windowsのデスクトップ通知
sound = true               # 通知音
# DiscordまたはSlackのWebhook URLを入れるとスマホにも届く（空なら使わない）
webhook_url = ""
